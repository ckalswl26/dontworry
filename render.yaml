services:
  - type: web
    name: dontworry-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FSS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ECOS_API_KEY
        sync: false
      - key: JUSTICE_STATS_API_KEY
        sync: false
      - key: CORS_ALLOW_ORIGINS
        value: https://dontworry.vercel.app
      - key: APP_ENV
        value: production
